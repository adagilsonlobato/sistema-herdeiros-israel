{% extends 'base.html' %}{% block content %}<p><a href="{{url_for('home')}}">← Painel</a></p><h1>Usuários e permissões</h1><div class="card"><h2>Criar usuário</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Nome</label><input name="name" required maxlength="120"><label>E-mail</label><input name="email" type="email" required><label>Senha inicial (mínimo 12 caracteres)</label><input name="password" type="password" required minlength="12"><label>Perfil</label><select name="role">{% for key,label in roles.items() %}<option value="{{key}}">{{label}}</option>{% endfor %}</select><label>Unidade (para conselheiro)</label><input name="unit" maxlength="120"><button type="submit">Criar usuário</button></form></div><h2>Contas cadastradas</h2>{% for user in users %}<div class="card"><strong>{{user.name}}</strong><p class="muted small">{{user.email}}</p><form method="post" action="{{url_for('update_user',uid=user.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Perfil</label><select name="role">{% for key,label in roles.items() %}<option value="{{key}}" {% if key==user.role %}selected{% endif %}>{{label}}</option>{% endfor %}</select><label>Unidade</label><input name="unit" value="{{user.unit or ''}}"><label>Nova senha (deixe vazio para manter)</label><input name="password" type="password" minlength="12"><button type="submit">Salvar alterações</button></form></div>{% endfor %}{% endblock %}
